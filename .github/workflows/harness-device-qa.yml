name: Verify mobile Harness sessions
on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: Repository containing the Conduit source commit
        required: true
        type: string
      source_commit:
        description: Full Git commit to test
        required: true
        type: string
  push:
    branches: [codex/deepseek-harness-device-qa]
permissions:
  contents: read
jobs:
  phone:
    name: Verify ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix: >-
        ${{ fromJSON(
          contains(github.event.head_commit.message, '[qa-ios26]') && '{"include":[{"platform":"ios","runner":"macos-26"}]}' ||
          contains(github.event.head_commit.message, '[qa-ios]') && '{"include":[{"platform":"ios","runner":"xcode-27"}]}' ||
          contains(github.event.head_commit.message, '[qa-android]') && '{"include":[{"platform":"android","runner":"ubuntu-24.04"}]}' ||
          '{"include":[{"platform":"ios","runner":"xcode-27"},{"platform":"android","runner":"ubuntu-24.04"}]}'
        ) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 85
    env:
      MAESTRO_CLI_NO_ANALYTICS: '1'
      MAESTRO_DRIVER_STARTUP_TIMEOUT: '180000'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      COCOAPODS_DISABLE_STATS: 'true'
      NO_COLOR: '1'
    steps:
      - name: Get synthetic QA bundle
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: tooling
          persist-credentials: false
      - name: Select exact feature commit
        id: product
        env:
          SOURCE_REVISION: ${{ inputs.source_commit }}
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" == push ]]; then
            SOURCE_REVISION=$(cat tooling/qa/source-commit)
          fi
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          echo "revision=$SOURCE_REVISION" >> "$GITHUB_OUTPUT"
      - name: Get Conduit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ inputs.source_repository || github.repository }}
          ref: ${{ steps.product.outputs.revision }}
          persist-credentials: false
          path: conduit
      - name: Record tested revision
        working-directory: conduit
        env:
          EXPECTED: ${{ steps.product.outputs.revision }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          echo "QA_COMMIT=$EXPECTED" >> "$GITHUB_ENV"
      - name: Look for the exact built app on this platform
        id: app
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/garden-qa/app-build
          key: garden-app-v1-${{ matrix.runner }}-flutter-3.50.0-${{ steps.product.outputs.revision }}
      - name: Install Flutter
        if: steps.app.outputs.cache-hit != 'true'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Install Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.15.0'
      - name: Install official Harness and test driver
        run: bash tooling/qa/tools.sh
      - name: Preflight phone image, tooling and virtualization
        run: cd conduit && bash ../tooling/qa/device.sh prepare "${{ matrix.platform }}"
      - name: Generate app and package sources
        if: steps.app.outputs.cache-hit != 'true'
        working-directory: conduit
        run: dart tool/setup_worktree.dart
      - name: Restore public mobile build dependencies
        if: steps.app.outputs.cache-hit != 'true'
        id: deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            conduit/ios/Pods
            ~/Library/Caches/org.swift.swiftpm/repositories
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: garden-deps-v1-${{ matrix.runner }}-${{ hashFiles('conduit/pubspec.lock', 'conduit/ios/Podfile.lock', 'conduit/android/**/gradle-wrapper.properties', 'conduit/ios/**/Package.resolved') }}
      - name: Build the real app at the selected revision
        if: steps.app.outputs.cache-hit != 'true'
        run: cd conduit && bash ../tooling/qa/device.sh build "${{ matrix.platform }}"
      - name: Cache the verified clean build before booting the device
        if: steps.app.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/garden-qa/app-build
          key: ${{ steps.app.outputs.cache-primary-key }}
      - name: Save verified public SDK dependencies before device interaction
        if: steps.app.outputs.cache-hit != 'true' && steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            conduit/ios/Pods
            ~/Library/Caches/org.swift.swiftpm/repositories
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: ${{ steps.deps.outputs.cache-primary-key }}
      - name: Boot a clean phone and install the verified app
        run: cd conduit && bash ../tooling/qa/device.sh boot "${{ matrix.platform }}"
      - name: Capture clean iOS startup state before the local server issues a grant
        if: matrix.platform == 'ios'
        run: |
          bash tooling/qa/install-ios-axe.sh
          python3 tooling/qa/capture-initial-ios.py
      - name: Stage the encrypted first iPhone screen for offline inspection
        if: matrix.platform == 'ios'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios-first-screen
          path: ${{ runner.temp }}/ios-first-screen.p7m
          if-no-files-found: error
          retention-days: 2
      - name: Capture clean Android launch before any fixture credential exists
        if: matrix.platform == 'android'
        run: python3 tooling/qa/capture-initial-android.py
      - name: Stage the encrypted first Android screen for offline inspection
        if: matrix.platform == 'android'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-first-screen
          path: ${{ runner.temp }}/android-first-screen.p7m
          if-no-files-found: error
          retention-days: 2
      - name: Start synthetic Harness and local model
        run: python3 tooling/qa/fixture.py
      - name: Exercise native and web workspaces, then seal verified media
        run: python3 tooling/qa/test-and-seal.py "${{ matrix.platform }}"
      - name: Stage encrypted evidence for offline review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.platform }}-review
          path: ${{ runner.temp }}/${{ matrix.platform }}-review.p7m
          if-no-files-found: error
          retention-days: 2
      - name: Stage completed native evidence if a subsequent workspace check failed
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.platform }}-native-review
          path: ${{ runner.temp }}/${{ matrix.platform }}-native-review.p7m
          if-no-files-found: ignore
          retention-days: 2
      - name: Check Android process health and known controls on failure
        if: failure() && matrix.platform == 'android'
        run: python3 tooling/qa/phone-status.py android failure
      - name: Seal limited build diagnostics
        if: failure()
        run: python3 tooling/qa/seal-diagnostics.py "${{ matrix.platform }}"
      - name: Stage encrypted build error excerpt
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.platform }}-build-diagnostics
          path: ${{ runner.temp }}/${{ matrix.platform }}-diagnostics.p7m
          if-no-files-found: ignore
          retention-days: 2
      - name: Seal a synthetic app screenshot and hierarchy after successful pairing
        if: failure()
        run: python3 tooling/qa/seal-paired-failure.py "${{ matrix.platform }}"
      - name: Stage encrypted post-pairing UI diagnostic
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.platform }}-paired-diagnostic
          path: ${{ runner.temp }}/${{ matrix.platform }}-paired-failure.p7m
          if-no-files-found: ignore
          retention-days: 2
