name: Synthetic scroll comparison

on:
  push:
    branches: [codex/scroll-benchmark-ci]
    paths:
      - .github/workflows/scroll-benchmark.yml
      - tool/scroll_benchmark/**

permissions:
  contents: read

concurrency:
  group: synthetic-scroll-comparison
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs=-Xmx2G -Dorg.gradle.workers.max=2
        -Dorg.gradle.daemon=false
        -Dorg.gradle.project.kotlin.compiler.execution.strategy=in-process
    steps:
      - name: Set isolated output paths
        run: |
          echo "BENCH_OUT=$RUNNER_TEMP/scroll-results" >> "$GITHUB_ENV"
          echo "BENCH_APKS=$RUNNER_TEMP/scroll-apks" >> "$GITHUB_ENV"
          echo "BENCH_TOOLS=$RUNNER_TEMP/scroll-tools" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: driver
          persist-credentials: false
      - id: plan
        run: |
          mkdir -p "$BENCH_OUT"
          cp driver/tool/scroll_benchmark/plan.json "$BENCH_OUT/plan.json"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re
          p = json.load(open('driver/tool/scroll_benchmark/plan.json'))
          for key in ('baseline', 'candidate'):
              assert re.fullmatch('[0-9a-f]{40}', p[key])
              print(f'{key}={p[key]}')
          print('flutter=' + p['flutter'])
          PY
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: app
          ref: ${{ steps.plan.outputs.baseline }}
          persist-credentials: false
      - name: Verify KVM before building
        run: |
          set -euo pipefail
          mkdir -p "$BENCH_OUT"
          lscpu > "$BENCH_OUT/virtualization.txt"
          cat "$BENCH_OUT/virtualization.txt"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          ls -l /dev/kvm | tee -a "$BENCH_OUT/virtualization.txt"
          python3 - <<'PY' | tee -a "$BENCH_OUT/virtualization.txt"
          import fcntl, os
          fd = os.open('/dev/kvm', os.O_RDWR)
          try:
              version = fcntl.ioctl(fd, 0xAE00, 0)
              print('KVM API version:', version)
              assert version == 12
          finally:
              os.close(fd)
          PY
      - id: builds
        name: Restore verified build outputs
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: scroll-x64-${{ steps.plan.outputs.flutter }}-${{ steps.plan.outputs.baseline }}-${{ steps.plan.outputs.candidate }}-${{ hashFiles('driver/.github/workflows/scroll-benchmark.yml', 'driver/tool/scroll_benchmark/build.sh', 'driver/tool/scroll_benchmark/*.dart', 'driver/tool/scroll_benchmark/apk_manifest.py') }}
          path: |
            ${{ env.BENCH_APKS }}
            ${{ env.BENCH_TOOLS }}
            ${{ env.BENCH_OUT }}/builds.json
            ${{ env.BENCH_OUT }}/*-package.json
            ${{ env.BENCH_OUT }}/*-packaging-*.json
            ${{ env.BENCH_OUT }}/tests.log
            ${{ env.BENCH_OUT }}/analysis.log
            ${{ env.BENCH_OUT }}/platform-lint.log
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        if: steps.builds.outputs.cache-hit != 'true'
        with:
          flutter-version: ${{ steps.plan.outputs.flutter }}
          channel: stable
          cache: true
      - name: Build both revisions and validate the candidate
        if: steps.builds.outputs.cache-hit != 'true'
        env:
          BASELINE: ${{ steps.plan.outputs.baseline }}
          CANDIDATE: ${{ steps.plan.outputs.candidate }}
        run: bash driver/tool/scroll_benchmark/build.sh
      - name: Cache verified build outputs before device setup
        if: steps.builds.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: ${{ steps.builds.outputs.cache-primary-key }}
          path: |
            ${{ env.BENCH_APKS }}
            ${{ env.BENCH_TOOLS }}
            ${{ env.BENCH_OUT }}/builds.json
            ${{ env.BENCH_OUT }}/*-package.json
            ${{ env.BENCH_OUT }}/*-packaging-*.json
            ${{ env.BENCH_OUT }}/tests.log
            ${{ env.BENCH_OUT }}/analysis.log
            ${{ env.BENCH_OUT }}/platform-lint.log
      - name: Run the fixed comparison
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 2048M
          cores: 2
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -no-snapshot -no-audio -no-boot-anim -camera-back none
          script: python3 driver/tool/scroll_benchmark/run.py
      - name: Preserve synthetic results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: synthetic-scroll-results
          retention-days: 30
          if-no-files-found: warn
          path: |
            ${{ env.BENCH_OUT }}/plan.json
            ${{ env.BENCH_OUT }}/builds.json
            ${{ env.BENCH_OUT }}/*-package.json
            ${{ env.BENCH_OUT }}/*-packaging-*.json
            ${{ env.BENCH_OUT }}/environment.json
            ${{ env.BENCH_OUT }}/virtualization.txt
            ${{ env.BENCH_OUT }}/report.json
            ${{ env.BENCH_OUT }}/failure.txt
            ${{ env.BENCH_OUT }}/uiautomator.txt
            ${{ env.BENCH_OUT }}/runtime-errors.txt
            ${{ env.BENCH_OUT }}/*-frames.json
            ${{ env.BENCH_OUT }}/*-frame-timings.json
            ${{ env.BENCH_OUT }}/*-memory.json
            ${{ env.BENCH_OUT }}/*.png
            ${{ env.BENCH_OUT }}/*-ui.xml
            ${{ env.BENCH_OUT }}/tests.log
            ${{ env.BENCH_OUT }}/analysis.log
            ${{ env.BENCH_OUT }}/platform-lint.log
